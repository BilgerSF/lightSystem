<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightSystem</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0d14;
      --surface:    rgba(255,255,255,0.05);
      --surface-hi: rgba(255,255,255,0.09);
      --border:     rgba(255,255,255,0.08);
      --text:       #e8e8f0;
      --muted:      rgba(232,232,240,0.45);
      --accent:     #7c6ff7;
      --accent2:    #a78bfa;
      --green:      #34d399;
      --red:        #f87171;
      --radius:     16px;
      --radius-sm:  10px;
      --transition: 0.18s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 20px 48px;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(124,111,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(167,139,250,0.08) 0%, transparent 55%);
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .container {
      max-width: 840px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Card ─────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      backdrop-filter: blur(10px);
      transition: background var(--transition);
    }
    .card:hover { background: var(--surface-hi); }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background 0.4s;
      flex-shrink: 0;
    }
    .status-dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.disconnected { background: var(--red); }
    .status-dot.connecting   { background: #f59e0b; animation: blink 1s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Segmented target selector ────────────────────────────────────────── */
    .target-row {
      display: flex;
      gap: 8px;
    }
    .target-btn {
      flex: 1;
      padding: 11px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
      user-select: none;
    }
    .target-btn:hover { background: var(--surface-hi); color: var(--text); }
    .target-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,111,247,0.35);
    }
    .target-label { display: flex; align-items: center; gap: 6px; justify-content: center; }
    .target-dot { width: 7px; height: 7px; border-radius: 50%; }
    .hue-dot   { background: #fbbf24; }
    .govee-dot { background: #34d399; }
    .both-dot  { background: linear-gradient(90deg,#fbbf24,#34d399); }

    /* ── Two-column row ───────────────────────────────────────────────────── */
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 16px;
    }

    /* ── Power buttons ────────────────────────────────────────────────────── */
    .power-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }
    .power-btn {
      flex: 1;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 56px;
    }
    .power-btn.on {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #1a1200;
      box-shadow: 0 4px 16px rgba(251,191,36,0.25);
    }
    .power-btn.on:hover  { box-shadow: 0 6px 24px rgba(251,191,36,0.4); transform: translateY(-1px); }
    .power-btn.off {
      background: rgba(248,113,113,0.15);
      color: var(--red);
      border: 1px solid rgba(248,113,113,0.25);
    }
    .power-btn.off:hover {
      background: rgba(248,113,113,0.25);
      box-shadow: 0 4px 16px rgba(248,113,113,0.2);
      transform: translateY(-1px);
    }

    /* ── Color section ────────────────────────────────────────────────────── */
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .swatch {
      width: 30px; height: 30px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .swatch:hover    { transform: scale(1.15); border-color: rgba(255,255,255,0.4); }
    .swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .color-picker-wrap {
      position: relative;
      width: 40px; height: 40px;
      flex-shrink: 0;
    }
    .color-picker-wrap input[type="color"] {
      position: absolute; inset: 0;
      opacity: 0;
      width: 100%; height: 100%;
      cursor: pointer;
    }
    .color-preview {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.15);
      pointer-events: none;
      transition: background 0.1s;
    }
    .color-hex {
      font-size: 13px;
      color: var(--muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      flex: 1;
    }
    .apply-color-btn {
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .apply-color-btn:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ── Brightness ───────────────────────────────────────────────────────── */
    .brightness-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brightness-icon { font-size: 16px; flex-shrink: 0; color: var(--muted); }
    .brightness-icon.hi { color: var(--text); }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(124,111,247,0.45);
      transition: transform var(--transition);
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .brightness-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      min-width: 38px;
      text-align: right;
    }

    /* ── Effects grid ─────────────────────────────────────────────────────── */
    .effects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .effect-btn {
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-align: center;
    }
    .effect-btn:hover {
      background: var(--surface-hi);
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .effect-btn.active {
      border-color: var(--accent);
      background: rgba(124,111,247,0.15);
      box-shadow: 0 0 0 1px rgba(124,111,247,0.4);
    }
    .effect-btn.dynamic.active {
      border-color: var(--accent2);
      animation: pulse-border 2s infinite;
    }
    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 0 1px rgba(167,139,250,0.4); }
      50%      { box-shadow: 0 0 0 3px rgba(167,139,250,0.2); }
    }

    .effect-swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .effect-icon { font-size: 22px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 20px 0 12px;
    }
    .section-label:first-child { margin-top: 0; }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15,15,25,0.95);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      backdrop-filter: blur(8px);
      white-space: nowrap;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error { border-color: rgba(248,113,113,0.4); color: var(--red); }

    /* ── Disabled state ───────────────────────────────────────────────────── */
    .disabled { pointer-events: none; opacity: 0.4; }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 580px) {
      .row-2 { grid-template-columns: 1fr; }
      .effects-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">💡</div>
      LightSystem
    </div>
    <div class="status-badge">
      <span class="status-dot connecting" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </header>

  <!-- Target selector -->
  <div class="card" style="padding:18px 24px;">
    <div class="card-title">Control Target</div>
    <div class="target-row">
      <button class="target-btn" data-target="hue" onclick="setTarget('hue')">
        <span class="target-label"><span class="target-dot hue-dot"></span>Hue Only</span>
      </button>
      <button class="target-btn active" data-target="both" onclick="setTarget('both')">
        <span class="target-label"><span class="target-dot both-dot"></span>Both</span>
      </button>
      <button class="target-btn" data-target="govee" onclick="setTarget('govee')">
        <span class="target-label"><span class="target-dot govee-dot"></span>Govee Only</span>
      </button>
    </div>
  </div>

  <!-- Power + Color -->
  <div class="row-2" id="controls">

    <!-- Power -->
    <div class="card">
      <div class="card-title">Power</div>
      <div class="power-buttons">
        <button class="power-btn on" onclick="setPower('on')">
          ☀️ Turn On
        </button>
        <button class="power-btn off" onclick="setPower('off')">
          🌙 Turn Off
        </button>
      </div>
    </div>

    <!-- Color -->
    <div class="card">
      <div class="card-title">Color</div>

      <div class="swatches" id="swatches"></div>

      <div class="color-picker-row">
        <div class="color-picker-wrap">
          <div class="color-preview" id="colorPreview" style="background:#ffffff;"></div>
          <input type="color" id="colorPicker" value="#ffffff" oninput="onColorInput(this.value)" />
        </div>
        <span class="color-hex" id="colorHex">#ffffff</span>
        <button class="apply-color-btn" onclick="applyCustomColor()">Apply</button>
      </div>
    </div>

  </div>

  <!-- Brightness -->
  <div class="card">
    <div class="card-title">Brightness</div>
    <div class="brightness-row">
      <span class="brightness-icon">🌑</span>
      <input type="range" id="briSlider" min="1" max="100" value="80"
             oninput="onBriInput(this.value)"
             onchange="applyBrightness(this.value)" />
      <span class="brightness-icon hi">☀️</span>
      <span class="brightness-value" id="briValue">80%</span>
    </div>
  </div>

  <!-- Effects -->
  <div class="card">
    <div class="card-title">Effects</div>

    <div class="section-label">Scenes</div>
    <div class="effects-grid" id="staticEffects"></div>

    <div class="section-label">Dynamic</div>
    <div class="effects-grid" id="dynamicEffects"></div>
  </div>

</div>

<div id="toast"></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────

  let currentTarget = 'both';
  let activeEffect  = null;
  let briTimer      = null;

  const SWATCHES = [
    { hex: '#ffffff', label: 'White'  },
    { hex: '#ffc58f', label: 'Warm'   },
    { hex: '#ff1e1e', label: 'Red'    },
    { hex: '#ff6400', label: 'Orange' },
    { hex: '#ffe600', label: 'Yellow' },
    { hex: '#00c850', label: 'Green'  },
    { hex: '#00c8dc', label: 'Cyan'   },
    { hex: '#1450ff', label: 'Blue'   },
    { hex: '#a000ff', label: 'Purple' },
    { hex: '#ff0096', label: 'Pink'   },
  ];

  const STATIC_EFFECTS = [
    { id: 'warm-white', label: 'Warm White',  color: '#ffc58f' },
    { id: 'cool-white', label: 'Cool White',  color: '#dcebff' },
    { id: 'sunset',     label: 'Sunset',      color: '#ff501e' },
    { id: 'ocean',      label: 'Ocean',       color: '#0082c8' },
    { id: 'forest',     label: 'Forest',      color: '#14a03c' },
    { id: 'purple',     label: 'Purple',      color: '#a000ff' },
    { id: 'red-alert',  label: 'Red Alert',   color: '#ff1414' },
    { id: 'candle',     label: 'Candle',      color: '#ff9329' },
    { id: 'movie',      label: 'Movie Night', color: '#0a0a32' },
    { id: 'energize',   label: 'Energize',    color: '#80c4ff' },
  ];

  const DYNAMIC_EFFECTS = [
    { id: 'breathing',    label: 'Breathing',    icon: '🫁' },
    { id: 'color-cycle',  label: 'Color Cycle',  icon: '🌈' },
    { id: 'strobe',       label: 'Strobe',       icon: '⚡' },
    { id: 'candle',       label: 'Candle',       icon: '🕯️' },
  ];

  // ── Build UI ────────────────────────────────────────────────────────────────

  function buildSwatches() {
    const el = document.getElementById('swatches');
    SWATCHES.forEach(s => {
      const btn = document.createElement('div');
      btn.className = 'swatch';
      btn.style.background = s.hex;
      btn.title = s.label;
      btn.onclick = () => selectSwatch(btn, s.hex);
      el.appendChild(btn);
    });
  }

  function buildEffects() {
    const staticEl  = document.getElementById('staticEffects');
    const dynamicEl = document.getElementById('dynamicEffects');

    STATIC_EFFECTS.forEach(e => {
      const btn = document.createElement('button');
      btn.className   = 'effect-btn';
      btn.dataset.id  = e.id;
      btn.innerHTML   = `<div class="effect-swatch" style="background:${e.color};"></div>${e.label}`;
      btn.onclick     = () => applyEffect(e.id, btn);
      staticEl.appendChild(btn);
    });

    DYNAMIC_EFFECTS.forEach(e => {
      const btn = document.createElement('button');
      btn.className  = 'effect-btn dynamic';
      btn.dataset.id = e.id;
      btn.innerHTML  = `<span class="effect-icon">${e.icon}</span>${e.label}`;
      btn.onclick    = () => applyEffect(e.id, btn);
      dynamicEl.appendChild(btn);
    });
  }

  // ── Target ──────────────────────────────────────────────────────────────────

  function setTarget(target) {
    currentTarget = target;
    document.querySelectorAll('.target-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.target === target);
    });
  }

  // ── API helpers ─────────────────────────────────────────────────────────────

  async function api(endpoint, body) {
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: currentTarget, ...body }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    } catch (e) {
      showToast(e.message, true);
      throw e;
    }
  }

  // ── Power ───────────────────────────────────────────────────────────────────

  async function setPower(state) {
    clearActiveEffect();
    await api('/api/power', { state });
    showToast(state === 'on' ? '💡 Lights on' : '🌙 Lights off');
  }

  // ── Color ───────────────────────────────────────────────────────────────────

  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#',''), 16);
    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
  }

  function onColorInput(hex) {
    document.getElementById('colorPreview').style.background = hex;
    document.getElementById('colorHex').textContent = hex;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  }

  function selectSwatch(btn, hex) {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('colorPicker').value = hex;
    document.getElementById('colorPreview').style.background = hex;
    document.getElementById('colorHex').textContent = hex;
    applyCustomColor();
  }

  async function applyCustomColor() {
    clearActiveEffect();
    const hex = document.getElementById('colorPicker').value;
    const { r, g, b } = hexToRgb(hex);
    await api('/api/color', { r, g, b });
    showToast(`Color set to ${hex}`);
  }

  // ── Brightness ──────────────────────────────────────────────────────────────

  function onBriInput(v) {
    document.getElementById('briValue').textContent = v + '%';
    // Update slider fill
    const sl = document.getElementById('briSlider');
    const pct = (v - sl.min) / (sl.max - sl.min) * 100;
    sl.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
  }

  async function applyBrightness(v) {
    clearTimeout(briTimer);
    briTimer = setTimeout(async () => {
      await api('/api/brightness', { value: parseInt(v, 10) });
    }, 120);
  }

  // ── Effects ─────────────────────────────────────────────────────────────────

  function clearActiveEffect() {
    document.querySelectorAll('.effect-btn.active').forEach(b => b.classList.remove('active'));
    activeEffect = null;
  }

  async function applyEffect(effectId, btn) {
    // If clicking the already-active dynamic effect, turn off
    if (btn.classList.contains('dynamic') && btn.classList.contains('active')) {
      clearActiveEffect();
      return;
    }
    clearActiveEffect();
    btn.classList.add('active');
    activeEffect = effectId;
    await api('/api/effect', { effect: effectId });
    if (!btn.classList.contains('dynamic')) {
      showToast(`Scene: ${btn.innerText.trim()}`);
      setTimeout(() => btn.classList.remove('active'), 900);
    } else {
      showToast(`Effect: ${btn.innerText.trim()} (tap again to stop)`);
    }
  }

  // ── Toast ────────────────────────────────────────────────────────────────────

  let toastTimer;
  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = '', 2500);
  }

  // ── Status polling ────────────────────────────────────────────────────────────

  async function checkStatus() {
    try {
      const { ready } = await fetch('/api/status').then(r => r.json());
      const dot  = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (ready) {
        dot.className  = 'status-dot connected';
        text.textContent = 'Connected';
        document.getElementById('controls').classList.remove('disabled');
      } else {
        dot.className  = 'status-dot connecting';
        text.textContent = 'Initializing…';
      }
    } catch {
      document.getElementById('statusDot').className  = 'status-dot disconnected';
      document.getElementById('statusText').textContent = 'Offline';
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────

  buildSwatches();
  buildEffects();
  onBriInput(80); // set initial slider fill

  // Disable controls until server says ready
  document.getElementById('controls').classList.add('disabled');

  checkStatus();
  setInterval(checkStatus, 3000);
</script>

</body>
</html>
