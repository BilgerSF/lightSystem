<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightSystem</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #d6d0c8;
      --panel:       #c8c2ba;
      --btn:         #afa298;
      --btn-hi:      #bdb0a6;
      --btn-shadow:  #8a7e74;
      --border:      #c0b8ae;
      --text:        #2e2318;
      --text-muted:  #7a6a58;
      --text-label:  #6a5a48;
      --accent:      #8a7a68;
      --green:       #40b870;
      --red:         #d04040;
      --radius:      12px;
      --radius-sm:   8px;
      --transition:  0.12s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 20px 56px;
    }

    /* ── Panel ────────────────────────────────────────────────────────────── */
    .panel {
      width: 100%;
      max-width: 1280px;
      background: var(--panel);
      border-radius: 24px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow:
        8px 8px 20px rgba(0,0,0,0.28),
        -3px -3px 10px rgba(255,255,255,0.38);
    }

    /* ── Raised button mixin ──────────────────────────────────────────────── */
    .btn {
      background: var(--btn);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      transition: all var(--transition);
      box-shadow:
        3px 3px 6px rgba(0,0,0,0.22),
        -1px -1px 4px rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .btn:hover {
      background: var(--btn-hi);
      box-shadow:
        4px 4px 8px rgba(0,0,0,0.22),
        -1px -1px 4px rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn:active, .btn.active {
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.18),
        inset 2px 2px 5px rgba(0,0,0,0.18),
        inset -1px -1px 2px rgba(255,255,255,0.28);
      transform: translateY(1px);
      background: #9e9288;
    }

    /* ── Section label ────────────────────────────────────────────────────── */
    .section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-label);
    }

    /* ── Target row ───────────────────────────────────────────────────────── */
    .target-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .target-btn {
      padding: 15px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .target-btn svg {
      display: block;
      flex-shrink: 0;
    }

    /* ── Two-column main layout ───────────────────────────────────────────── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 14px;
      align-items: start;
    }

    /* ── Mid section: brightness + color ──────────────────────────────────── */
    .mid-section {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 12px;
      align-items: start;
      background: #b5afa8;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.18), inset -1px -1px 3px rgba(255,255,255,0.18);
    }

    /* ── Brightness column ────────────────────────────────────────────────── */
    .bri-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .bri-header {
      margin-bottom: 2px;
    }
    .bri-btn {
      padding: 11px 0;
      width: 100%;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 8px;
    }
    .bri-btn.active {
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.18),
        inset 2px 2px 5px rgba(0,0,0,0.18),
        inset -1px -1px 2px rgba(255,255,255,0.28);
      background: #9e9288;
    }

    /* ── Color grid ───────────────────────────────────────────────────────── */
    .color-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .color-header {
      text-align: right;
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }
    .swatch {
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition);
      box-shadow: 2px 2px 4px rgba(0,0,0,0.2), -1px -1px 3px rgba(255,255,255,0.3);
    }
    .swatch:hover { transform: scale(1.08); }
    .swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.5), 2px 2px 4px rgba(0,0,0,0.2);
    }

    /* ── Effects section ──────────────────────────────────────────────────── */
    .fx-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #b5afa8;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.18), inset -1px -1px 3px rgba(255,255,255,0.18);
    }
    .fx-header {
      text-align: right;
    }

    /* Color strip selector */
    .color-strips {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }
    .color-strip {
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition);
      box-shadow: 2px 2px 4px rgba(0,0,0,0.18), -1px -1px 2px rgba(255,255,255,0.3);
    }
    .color-strip.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
    }

    /* Timer + FX grid */
    .fx-body {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
    }

    .timer-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .timer-btn {
      padding: 13px 0;
      width: 100%;
      font-size: 12px;
      border-radius: 8px;
    }
    .timer-btn .unit {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .fx-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
    }
    .fx-btn {
      padding: 18px 4px;
      font-size: 12px;
      border-radius: 8px;
    }
    .fx-btn.active {
      background: #9e9288;
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.18),
        inset 2px 2px 5px rgba(0,0,0,0.18),
        inset -1px -1px 2px rgba(255,255,255,0.28);
    }
    .fx-btn:disabled, .fx-btn.fx-disabled {
      opacity: 0.38;
      cursor: not-allowed;
      pointer-events: none;
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.10),
        inset 1px 1px 3px rgba(0,0,0,0.14);
      background: #a49a90;
    }

    /* ── Power toggle ─────────────────────────────────────────────────────── */
    .power-row {
      display: flex;
      justify-content: center;
      padding: 4px 0 2px;
    }
    .power-toggle {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--btn);
      border-radius: 40px;
      padding: 11px 24px;
      cursor: pointer;
      box-shadow:
        3px 3px 6px rgba(0,0,0,0.22),
        -1px -1px 4px rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.28);
      border: none;
      transition: all var(--transition);
      min-width: 200px;
      justify-content: space-between;
    }
    .power-toggle:hover { background: var(--btn-hi); }
    .power-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--panel);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2), inset -1px -1px 2px rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .power-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex: 1;
      text-align: center;
    }
    .power-indicator {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 5px rgba(200,60,60,0.5);
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .power-indicator.on {
      background: var(--green);
      box-shadow: 0 0 6px rgba(64,184,112,0.6);
    }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(46,35,24,0.92);
      color: #e8ddd0;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap;
      z-index: 100;
      letter-spacing: 0.02em;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: rgba(140,40,40,0.92); }

    /* ── Disabled state ───────────────────────────────────────────────────── */
    .disabled { pointer-events: none; opacity: 0.45; }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    /* Tablet: collapse two-column main grid → single column */
    @media (max-width: 700px) {
      .main-grid { grid-template-columns: 1fr; }
      .fx-header { text-align: left; }
    }
    /* Mobile: shrink internal grids */
    @media (max-width: 480px) {
      body { padding: 16px 10px 40px; }
      .panel { padding: 14px; gap: 10px; border-radius: 18px; }
      .mid-section { grid-template-columns: 80px 1fr; gap: 8px; }
      .fx-body { grid-template-columns: 80px 1fr; gap: 8px; }
      .bri-btn { padding: 9px 0; font-size: 12px; }
      .target-btn { padding: 12px 8px; font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="panel">

  <!-- Target selector -->
  <div class="target-row">
    <button class="btn target-btn" data-target="hue" onclick="setTarget('hue')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18h6M10 22h4M12 2a7 7 0 0 1 4.9 11.9c-.8.8-1.4 1.8-1.7 2.8H8.8c-.3-1-.9-2-1.7-2.8A7 7 0 0 1 12 2z"/>
      </svg>
      HUE
    </button>
    <button class="btn target-btn active" data-target="both" onclick="setTarget('both')">BOTH</button>
    <button class="btn target-btn" data-target="govee" onclick="setTarget('govee')">
      <svg width="20" height="12" viewBox="0 0 40 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="1" y="3" width="38" height="6" rx="3" fill="none"/>
        <circle cx="8"  cy="6" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="16" cy="6" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="24" cy="6" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="32" cy="6" r="1.6" fill="currentColor" stroke="none"/>
      </svg>
      GOVEE
    </button>
  </div>

  <!-- Two-column main body -->
  <div class="main-grid" id="controls">

    <!-- LEFT: Brightness + Color -->
    <div class="mid-section">

      <!-- Brightness column -->
      <div class="bri-col">
        <div class="section-label bri-header">BRIGHTNESS</div>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(100)">100</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(80)">80</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(60)">60</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(40)">40</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(20)">20</button>
      </div>

      <!-- Color grid -->
      <div class="color-col">
        <div class="section-label color-header">COLOR</div>
        <div class="swatches" id="swatches"></div>
      </div>

    </div>

    <!-- RIGHT: Effects -->
    <div class="fx-section">
      <div class="section-label fx-header">EFFECTS</div>

      <!-- Color strip palette selector -->
      <div class="color-strips" id="colorStrips"></div>

      <!-- Timer + FX grid -->
      <div class="fx-body">

        <!-- Timer buttons -->
        <div class="timer-col">
          <button class="btn timer-btn" onclick="applyTimer(60, this)">60 <span class="unit">SEC</span></button>
          <button class="btn timer-btn" onclick="applyTimer(45, this)">45 <span class="unit">SEC</span></button>
          <button class="btn timer-btn" onclick="applyTimer(30, this)">30 <span class="unit">SEC</span></button>
          <button class="btn timer-btn" onclick="applyTimer(15, this)">15 <span class="unit">SEC</span></button>
        </div>

        <!-- FX buttons 3×2 -->
        <div class="fx-grid" id="fxGrid"></div>

      </div>
    </div>

  </div>

  <!-- Power toggle -->
  <div class="power-row">
    <button class="power-toggle" onclick="togglePower()">
      <div class="power-icon">⏻</div>
      <span class="power-label">ON / OFF</span>
      <div class="power-indicator" id="powerIndicator"></div>
    </button>
  </div>

</div>

<div id="toast"></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────

  let currentTarget  = 'both';
  let activeEffect   = null;
  let lightsOn       = false;
  let currentBri     = 80;
  let activeTimer    = null;
  let timerInterval  = null;

  // 10 swatches: 5 columns × 2 rows
  const SWATCHES = [
    { hex: '#e03030', label: 'Red'        },
    { hex: '#f07030', label: 'Orange'     },
    { hex: '#f0d030', label: 'Yellow'     },
    { hex: '#30cc60', label: 'Green'      },
    { hex: '#50a8e8', label: 'Sky Blue'   },
    { hex: '#8030d0', label: 'Purple'     },
    { hex: '#e030c8', label: 'Magenta'    },
    { hex: '#f090b8', label: 'Pink'       },
    { hex: '#20c8c0', label: 'Teal'       },
    { hex: '#90c8f0', label: 'Pale Blue'  },
  ];

  // Color strips for effect palette selection
  const COLOR_STRIPS = [
    { hex: '#e03030', id: 'strip-red'    },
    { hex: '#30cc60', id: 'strip-green'  },
    { hex: '#90c8f0', id: 'strip-blue'   },
    { hex: '#f0d030', id: 'strip-yellow' },
    { hex: '#8030d0', id: 'strip-purple' },
    { hex: '#e030c8', id: 'strip-pink'   },
  ];

  // 6 FX effects mapped to fx-grid (3×2)
  const FX_EFFECTS = [
    { id: 'breathing',   label: 'FX1' },
    { id: 'color-cycle', label: 'FX2' },
    { id: 'strobe',      label: 'FX3' },
    { id: 'candle',      label: 'FX4', disabled: true },
    { id: 'sunset',      label: 'FX5', disabled: true },
    { id: 'ocean',       label: 'FX6', disabled: true },
  ];

  // ── Build UI ────────────────────────────────────────────────────────────────

  function buildSwatches() {
    const el = document.getElementById('swatches');
    SWATCHES.forEach(s => {
      const div = document.createElement('div');
      div.className = 'swatch';
      div.style.background = s.hex;
      div.title = s.label;
      div.onclick = () => selectSwatch(div, s.hex);
      el.appendChild(div);
    });
  }

  function buildColorStrips() {
    const el = document.getElementById('colorStrips');
    COLOR_STRIPS.forEach(s => {
      const div = document.createElement('div');
      div.className = 'color-strip';
      div.style.background = s.hex;
      div.dataset.id = s.id;
      div.onclick = () => selectStrip(div, s.hex);
      el.appendChild(div);
    });
  }

  function buildFxGrid() {
    const el = document.getElementById('fxGrid');
    FX_EFFECTS.forEach(e => {
      const btn = document.createElement('button');
      btn.className = 'btn fx-btn' + (e.disabled ? ' fx-disabled' : '');
      btn.dataset.id = e.id;
      btn.textContent = e.label;
      if (e.disabled) {
        btn.disabled = true;
      } else {
        btn.onclick = () => applyFx(e.id, btn);
      }
      el.appendChild(btn);
    });
  }

  // ── Target ──────────────────────────────────────────────────────────────────

  function setTarget(target) {
    currentTarget = target;
    document.querySelectorAll('.target-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.target === target);
    });
  }

  // ── API helpers ─────────────────────────────────────────────────────────────

  async function api(endpoint, body) {
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: currentTarget, ...body }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    } catch (e) {
      showToast(e.message, true);
      throw e;
    }
  }

  // ── Power ───────────────────────────────────────────────────────────────────

  async function togglePower() {
    lightsOn = !lightsOn;
    document.getElementById('powerIndicator').classList.toggle('on', lightsOn);
    await api('/api/power', { state: lightsOn ? 'on' : 'off' });
    showToast(lightsOn ? 'Lights ON' : 'Lights OFF');
  }

  // ── Color ───────────────────────────────────────────────────────────────────

  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#',''), 16);
    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
  }

  function selectSwatch(btn, hex) {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');
    const { r, g, b } = hexToRgb(hex);
    api('/api/color', { r, g, b });
    showToast(`Color → ${hex}`);
  }

  function selectStrip(el, hex) {
    document.querySelectorAll('.color-strip').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    const { r, g, b } = hexToRgb(hex);
    api('/api/color', { r, g, b });
  }

  // ── Brightness ──────────────────────────────────────────────────────────────

  function applyBrightnessBtn(pct) {
    document.querySelectorAll('.bri-btn').forEach(b => b.classList.remove('active'));
    if (pct > 0) {
      const btns = document.querySelectorAll('.bri-btn');
      const vals = [100, 80, 60, 40, 20];
      const idx  = vals.indexOf(pct);
      if (idx >= 0) btns[idx].classList.add('active');
    }
    currentBri = pct;
    if (pct === 0) {
      api('/api/power', { state: 'off' });
      showToast('Lights OFF');
    } else {
      api('/api/brightness', { value: pct });
      showToast(`Brightness → ${pct}%`);
    }
  }

  // ── Timer ───────────────────────────────────────────────────────────────────

  function applyTimer(seconds, btn) {
    document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    clearTimeout(timerInterval);
    activeTimer = seconds;
    showToast(`Timer: ${seconds}s`);
    timerInterval = setTimeout(async () => {
      await api('/api/power', { state: 'off' });
      document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
      lightsOn = false;
      document.getElementById('powerIndicator').classList.remove('on');
      showToast('Timer: lights off');
    }, seconds * 1000);
  }

  // ── FX ───────────────────────────────────────────────────────────────────────

  async function applyFx(effectId, btn) {
    const isActive = btn.classList.contains('active');
    document.querySelectorAll('.fx-btn').forEach(b => b.classList.remove('active'));
    if (isActive) {
      activeEffect = null;
      await api('/api/power', { state: 'on' }); // stopEffect() is called server-side
      showToast('Effect stopped');
      return;
    }
    btn.classList.add('active');
    activeEffect = effectId;
    await api('/api/effect', { effect: effectId });
    showToast(`Effect: ${btn.textContent}`);
  }

  // ── Toast ────────────────────────────────────────────────────────────────────

  let toastTimer;
  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = '', 2500);
  }

  // ── Status polling ────────────────────────────────────────────────────────────

  async function checkStatus() {
    try {
      const { ready } = await fetch('/api/status').then(r => r.json());
      if (ready) {
        document.getElementById('controls').classList.remove('disabled');
      }
    } catch { /* server offline — controls stay disabled */ }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────

  buildSwatches();
  buildColorStrips();
  buildFxGrid();

  document.getElementById('controls').classList.add('disabled');

  checkStatus();
  setInterval(checkStatus, 3000);
</script>

</body>
</html>
