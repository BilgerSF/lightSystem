<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightSystem</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #d6d0c8;
      --panel:       #c8c2ba;
      --btn:         #afa298;
      --btn-hi:      #bdb0a6;
      --btn-shadow:  #8a7e74;
      --border:      #c0b8ae;
      --text:        #2e2318;
      --text-muted:  #7a6a58;
      --text-label:  #6a5a48;
      --accent:      #8a7a68;
      --green:       #40b870;
      --red:         #d04040;
      --radius:      12px;
      --radius-sm:   8px;
      --transition:  0.12s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 20px 56px;
    }

    /* ── Panel ────────────────────────────────────────────────────────────── */
    .panel {
      width: 100%;
      max-width: 1280px;
      background: var(--panel);
      border-radius: 24px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow:
        8px 8px 20px rgba(0,0,0,0.28),
        -3px -3px 10px rgba(255,255,255,0.38);
    }

    /* ── Raised button mixin ──────────────────────────────────────────────── */
    .btn {
      background: var(--btn);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      transition: all var(--transition);
      box-shadow:
        3px 3px 6px rgba(0,0,0,0.22),
        -1px -1px 4px rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .btn:hover {
      background: var(--btn-hi);
      box-shadow:
        4px 4px 8px rgba(0,0,0,0.22),
        -1px -1px 4px rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn:active, .btn.active {
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.18),
        inset 2px 2px 5px rgba(0,0,0,0.18),
        inset -1px -1px 2px rgba(255,255,255,0.28);
      transform: translateY(1px);
      background: #9e9288;
    }

    /* ── Section label ────────────────────────────────────────────────────── */
    .section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-label);
    }

    /* ── Target buttons (inside mid-section) ─────────────────────────── */
    .target-row-inner {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 2px;
    }
    .target-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
    }
    .target-btn {
      padding: 11px 4px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .target-btn svg { display: block; flex-shrink: 0; }

    /* ── Two-column main layout ───────────────────────────────────────────── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 14px;
      align-items: start;
    }

    /* ── Mid section: brightness + color ──────────────────────────────────── */
    .mid-section {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 12px;
      align-items: start;
      background: #b5afa8;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.18), inset -1px -1px 3px rgba(255,255,255,0.18);
    }

    /* ── Brightness column ────────────────────────────────────────────────── */
    .bri-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .bri-header {
      margin-bottom: 2px;
    }
    .bri-btn {
      padding: 11px 0;
      width: 100%;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 8px;
    }
    .bri-btn.active {
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.18),
        inset 2px 2px 5px rgba(0,0,0,0.18),
        inset -1px -1px 2px rgba(255,255,255,0.28);
      background: #9e9288;
    }

    /* ── Color grid ───────────────────────────────────────────────────────── */
    .color-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .color-header {
      text-align: right;
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }
    .swatch {
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition);
      box-shadow: 2px 2px 4px rgba(0,0,0,0.2), -1px -1px 3px rgba(255,255,255,0.3);
    }
    .swatch:hover { transform: scale(1.08); }
    .swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.5), 2px 2px 4px rgba(0,0,0,0.2);
    }

    /* ── Effects section ──────────────────────────────────────────────────── */
    .fx-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #b5afa8;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.18), inset -1px -1px 3px rgba(255,255,255,0.18);
    }
    .fx-header {
      text-align: right;
    }

    /* Color strip selector */
    .color-strips {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }
    .color-strip {
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition);
      box-shadow: 2px 2px 4px rgba(0,0,0,0.18), -1px -1px 2px rgba(255,255,255,0.3);
    }
    .color-strip.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
    }

    /* Timer + FX grid */
    .fx-body {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
    }

    .timer-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .timer-btn {
      padding: 13px 0;
      width: 100%;
      font-size: 12px;
      border-radius: 8px;
    }
    .timer-btn .unit {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .fx-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
    }
    .fx-btn {
      padding: 18px 4px;
      font-size: 12px;
      border-radius: 8px;
    }
    .fx-btn.active {
      background: #9e9288;
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.18),
        inset 2px 2px 5px rgba(0,0,0,0.18),
        inset -1px -1px 2px rgba(255,255,255,0.28);
    }
    .fx-btn:disabled, .fx-btn.fx-disabled {
      opacity: 0.38;
      cursor: not-allowed;
      pointer-events: none;
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.10),
        inset 1px 1px 3px rgba(0,0,0,0.14);
      background: #a49a90;
    }

    /* ── Power toggle ─────────────────────────────────────────────────────── */
    .power-row {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 0 2px;
      position: relative;
    }
    .blackout-btn {
      position: absolute;
      left: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #7a3030;
      border: none;
      border-radius: 40px;
      padding: 11px 24px;
      cursor: pointer;
      box-shadow:
        3px 3px 6px rgba(0,0,0,0.30),
        -1px -1px 4px rgba(255,255,255,0.18),
        inset 0 1px 0 rgba(255,255,255,0.14);
      transition: all var(--transition);
      min-width: 160px;
      justify-content: space-between;
    }
    .blackout-btn:hover { background: #943838; }
    .blackout-btn:active {
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.22),
        inset 2px 2px 5px rgba(0,0,0,0.28),
        inset -1px -1px 2px rgba(255,255,255,0.12);
      transform: translateY(1px);
      background: #6a2828;
    }
    .update-btn {
      position: absolute;
      right: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--btn);
      border: none;
      border-radius: 40px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow:
        3px 3px 6px rgba(0,0,0,0.22),
        -1px -1px 4px rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.28);
      transition: all var(--transition);
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .update-btn:hover { background: var(--btn-hi); }
    .update-btn:active {
      box-shadow:
        1px 1px 2px rgba(0,0,0,0.18),
        inset 2px 2px 5px rgba(0,0,0,0.18),
        inset -1px -1px 2px rgba(255,255,255,0.28);
      transform: translateY(1px);
      background: #9e9288;
    }
    .update-btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .blackout-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.3), inset -1px -1px 2px rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .blackout-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e8c0c0;
      flex: 1;
      text-align: center;
    }
    .power-toggle {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--btn);
      border-radius: 40px;
      padding: 11px 24px;
      cursor: pointer;
      box-shadow:
        3px 3px 6px rgba(0,0,0,0.22),
        -1px -1px 4px rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.28);
      border: none;
      transition: all var(--transition);
      min-width: 200px;
      justify-content: space-between;
    }
    .power-toggle:hover { background: var(--btn-hi); }
    .power-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--panel);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2), inset -1px -1px 2px rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .power-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex: 1;
      text-align: center;
    }
    .power-indicator {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 5px rgba(200,60,60,0.5);
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .power-indicator.on {
      background: var(--green);
      box-shadow: 0 0 6px rgba(64,184,112,0.6);
    }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(46,35,24,0.92);
      color: #e8ddd0;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap;
      z-index: 100;
      letter-spacing: 0.02em;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: rgba(140,40,40,0.92); }

    /* ── Disabled state ───────────────────────────────────────────────────── */
    .disabled { pointer-events: none; opacity: 0.45; }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    /* Tablet: collapse two-column main grid → single column */
    @media (max-width: 700px) {
      .main-grid { grid-template-columns: 1fr; }
      .fx-header { text-align: left; }
    }
    /* Mobile: shrink internal grids */
    @media (max-width: 480px) {
      body { padding: 16px 10px 40px; }
      .panel { padding: 14px; gap: 10px; border-radius: 18px; }
      .mid-section { grid-template-columns: 80px 1fr; gap: 8px; }
      .fx-body { grid-template-columns: 80px 1fr; gap: 8px; }
      .bri-btn { padding: 9px 0; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="panel">

  <!-- Two-column main body -->
  <div class="main-grid" id="controls">

    <!-- LEFT: Brightness + Color -->
    <div class="mid-section">

      <!-- Target selector -->
      <div class="target-row-inner">
        <div class="section-label">TARGET</div>
        <div class="target-btn-row">
          <button class="btn target-btn" data-target="hue" onclick="setTarget('hue')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18h6M10 22h4M12 2a7 7 0 0 1 4.9 11.9c-.8.8-1.4 1.8-1.7 2.8H8.8c-.3-1-.9-2-1.7-2.8A7 7 0 0 1 12 2z"/>
            </svg>
            HUE
          </button>
          <button class="btn target-btn active" data-target="both" onclick="setTarget('both')">BOTH</button>
          <button class="btn target-btn" data-target="govee" onclick="setTarget('govee')">
            <svg width="18" height="10" viewBox="0 0 40 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="1" y="3" width="38" height="6" rx="3" fill="none"/>
              <circle cx="8"  cy="6" r="1.6" fill="currentColor" stroke="none"/>
              <circle cx="16" cy="6" r="1.6" fill="currentColor" stroke="none"/>
              <circle cx="24" cy="6" r="1.6" fill="currentColor" stroke="none"/>
              <circle cx="32" cy="6" r="1.6" fill="currentColor" stroke="none"/>
            </svg>
            GOVEE
          </button>
        </div>
      </div>

      <!-- Brightness column -->
      <div class="bri-col">
        <div class="section-label bri-header">BRIGHTNESS</div>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(100)">100</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(80)">80</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(60)">60</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(40)">40</button>
        <button class="btn bri-btn" onclick="applyBrightnessBtn(20)">20</button>
      </div>

      <!-- Color grid -->
      <div class="color-col">
        <div class="section-label color-header">COLOR</div>
        <div class="swatches" id="swatches"></div>
      </div>

    </div>

    <!-- RIGHT: Effects -->
    <div class="fx-section">
      <div class="section-label fx-header">EFFECTS</div>

      <!-- Color strip palette selector -->
      <div class="color-strips">
        <div class="color-strip" style="background:#e03030" data-id="strip-red"    onclick="selectStrip(this,'#e03030')"></div>
        <div class="color-strip" style="background:#30cc60" data-id="strip-green"  onclick="selectStrip(this,'#30cc60')"></div>
        <div class="color-strip" style="background:#90c8f0" data-id="strip-blue"   onclick="selectStrip(this,'#90c8f0')"></div>
        <div class="color-strip" style="background:#f0d030" data-id="strip-yellow" onclick="selectStrip(this,'#f0d030')"></div>
        <div class="color-strip" style="background:#8030d0" data-id="strip-purple" onclick="selectStrip(this,'#8030d0')"></div>
        <div class="color-strip" style="background:#e030c8" data-id="strip-pink"   onclick="selectStrip(this,'#e030c8')"></div>
      </div>

      <!-- Timer + FX grid -->
      <div class="fx-body">

        <!-- Timer buttons -->
        <div class="timer-col">
          <button class="btn timer-btn" data-secs="60" onclick="applyTimer(60, this)">60 <span class="unit">SEC</span></button>
          <button class="btn timer-btn" data-secs="45" onclick="applyTimer(45, this)">45 <span class="unit">SEC</span></button>
          <button class="btn timer-btn" data-secs="30" onclick="applyTimer(30, this)">30 <span class="unit">SEC</span></button>
          <button class="btn timer-btn" data-secs="15" onclick="applyTimer(15, this)">15 <span class="unit">SEC</span></button>
        </div>

        <!-- FX buttons 3×2 -->
        <div class="fx-grid">
          <button class="btn fx-btn" data-id="fade"        onclick="applyFx('fade', this)">FADE</button>
          <button class="btn fx-btn" data-id="dance" onclick="applyFx('dance', this)">DANCE</button>
          <button class="btn fx-btn" data-id="strobe"      onclick="applyFx('strobe', this)">FX3</button>
          <button class="btn fx-btn fx-disabled" disabled>FX4</button>
          <button class="btn fx-btn fx-disabled" disabled>FX5</button>
          <button class="btn fx-btn fx-disabled" disabled>FX6</button>
        </div>

      </div>
    </div>

  </div>

  <!-- Power toggle -->
  <div class="power-row">
    <button class="blackout-btn" onclick="blackOut()">
      <div class="blackout-icon">⬛</div>
      <span class="blackout-label">Black Out</span>
    </button>
    <button class="power-toggle" onclick="togglePower()">
      <div class="power-icon">⏻</div>
      <span class="power-label">ON / OFF</span>
      <div class="power-indicator" id="powerIndicator"></div>
    </button>
    <button class="update-btn" id="updateBtn" onclick="pullUpdate()">↓ Update</button>
  </div>

</div>

<div id="toast"></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────

  let currentTarget  = 'both';
  let activeEffect   = null;
  const powerState  = { hue: false, govee: false };
  let lightsOn       = false; // derived — reflects current target
  let currentBri     = 80;
  let activeTimer       = null;
  let timerInterval     = null;
  let countdownInterval = null;
  let fxColorReady   = false;
  let fxTimerReady   = false;
  let fxColor        = null;
  let micStream      = null;
  let micAudioCtx    = null;
  let micRafId       = null;  // holds setInterval id for mic polling
  let micSocket      = null;  // WebSocket for dance mic volume

  // 10 swatches: 5 columns × 2 rows
  const SWATCHES = [
    { hex: '#e03030', label: 'Red'        },
    { hex: '#f07030', label: 'Orange'     },
    { hex: '#f0d030', label: 'Yellow'     },
    { hex: '#30cc60', label: 'Green'      },
    { hex: '#50a8e8', label: 'Sky Blue'   },
    { hex: '#8030d0', label: 'Purple'     },
    { hex: '#e030c8', label: 'Magenta'    },
    { hex: '#f090b8', label: 'Pink'       },
    { hex: '#20c8c0', label: 'Teal'       },
    { hex: '#90c8f0', label: 'Pale Blue'  },
  ];

  // ── Build UI ────────────────────────────────────────────────────────────────

  function buildSwatches() {
    const el = document.getElementById('swatches');
    SWATCHES.forEach(s => {
      const div = document.createElement('div');
      div.className = 'swatch';
      div.style.background = s.hex;
      div.title = s.label;
      div.onclick = () => selectSwatch(div, s.hex);
      el.appendChild(div);
    });
  }

  function updateFxAvailability() { /* no-op: buttons stay enabled, message shown on click */ }

  // ── Target ──────────────────────────────────────────────────────────────────

  function setTarget(target) {
    currentTarget = target;
    document.querySelectorAll('.target-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.target === target);
    });
    // Reflect this target's power state on the indicator
    if (target === 'both') {
      lightsOn = powerState.hue || powerState.govee;
    } else {
      lightsOn = powerState[target];
    }
    document.getElementById('powerIndicator').classList.toggle('on', lightsOn);
  }

  // ── API helpers ─────────────────────────────────────────────────────────────

  async function api(endpoint, body) {
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: currentTarget, ...body }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    } catch (e) {
      showToast(e.message, true);
      throw e;
    }
  }

  // ── Power ───────────────────────────────────────────────────────────────────

  function stopAllEffects() {
    document.querySelectorAll('.fx-btn').forEach(b => b.classList.remove('active'));
    clearTimeout(timerInterval);
    clearInterval(countdownInterval);
    timerInterval     = null;
    countdownInterval = null;
    activeEffect      = null;
    if (micRafId)   { clearInterval(micRafId); micRafId = null; }
    if (micAudioCtx){ micAudioCtx.close(); micAudioCtx = null; }
    if (micStream)  { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (micSocket)  { micSocket.close(); micSocket = null; }
  }

  async function blackOut() {
    stopAllEffects();
    powerState.hue   = false;
    powerState.govee = false;
    lightsOn = false;
    document.getElementById('powerIndicator').classList.remove('on');
    await api('/api/power', { target: 'both', state: 'off' });
    showToast('All lights OFF');
  }

  async function togglePower() {
    lightsOn = !lightsOn;
    // Persist state per target
    if (currentTarget === 'both') {
      powerState.hue   = lightsOn;
      powerState.govee = lightsOn;
    } else {
      powerState[currentTarget] = lightsOn;
    }
    document.getElementById('powerIndicator').classList.toggle('on', lightsOn);
    await api('/api/power', { state: lightsOn ? 'on' : 'off' });
    showToast(lightsOn ? 'Lights ON' : 'Lights OFF');
  }

  // ── Color ───────────────────────────────────────────────────────────────────

  function hexToRgb(hex) {
    const n = parseInt(hex.replace('#',''), 16);
    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
  }

  function selectSwatch(btn, hex) {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');
    const { r, g, b } = hexToRgb(hex);
    api('/api/color', { r, g, b });
    showToast(`Color → ${hex}`);
  }

  function selectStrip(el, hex) {
    document.querySelectorAll('.color-strip').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    fxColor      = hex;
    fxColorReady = true;
    updateFxAvailability();
  }

  // ── Brightness ──────────────────────────────────────────────────────────────

  function applyBrightnessBtn(pct) {
    document.querySelectorAll('.bri-btn').forEach(b => b.classList.remove('active'));
    if (pct > 0) {
      const btns = document.querySelectorAll('.bri-btn');
      const vals = [100, 80, 60, 40, 20];
      const idx  = vals.indexOf(pct);
      if (idx >= 0) btns[idx].classList.add('active');
    }
    currentBri = pct;
    if (pct === 0) {
      api('/api/power', { state: 'off' });
      showToast('Lights OFF');
    } else {
      api('/api/brightness', { value: pct });
      showToast(`Brightness → ${pct}%`);
    }
  }

  // ── Timer ───────────────────────────────────────────────────────────────────

  function applyTimer(seconds, btn) {
    // Clear any running countdown/timer
    clearTimeout(timerInterval);
    clearInterval(countdownInterval);
    timerInterval     = null;
    countdownInterval = null;
    // Reset all timer button labels and mark selected
    document.querySelectorAll('.timer-btn').forEach(b => {
      b.innerHTML = `${b.dataset.secs} <span class="unit">SEC</span>`;
      b.classList.remove('active');
    });
    btn.classList.add('active');
    activeTimer  = seconds;
    fxTimerReady = true;
    updateFxAvailability();
    showToast(`Timer: ${seconds}s`);
  }

  // ── FX ───────────────────────────────────────────────────────────────────────

  async function applyFx(effectId, btn) {
    const needsTimer = effectId !== 'dance';
    if (!fxColorReady && (needsTimer && !fxTimerReady)) {
      showToast('Select a color and a timer first', true); return;
    }
    if (!fxColorReady) {
      showToast('Select a color strip first', true); return;
    }
    if (needsTimer && !fxTimerReady) {
      showToast('Select a timer first', true); return;
    }
    const isActive = btn.classList.contains('active');
    document.querySelectorAll('.fx-btn').forEach(b => b.classList.remove('active'));
    if (isActive) {
      activeEffect = null;
      if (micRafId) { clearInterval(micRafId); micRafId = null; }
      if (micAudioCtx) { micAudioCtx.close(); micAudioCtx = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (micSocket) { micSocket.close(); micSocket = null; }
      await api('/api/power', { state: 'on', target: 'govee' }); // stopEffect() is called server-side
      showToast('Effect stopped');
      return;
    }
    btn.classList.add('active');
    activeEffect = effectId;
    if (effectId === 'dance') {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        console.log('Got mic stream', micStream);
        micAudioCtx = new AudioContext();
        const source   = micAudioCtx.createMediaStreamSource(micStream);
        const analyser = micAudioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const buf = new Uint8Array(analyser.frequencyBinCount);
        micSocket = new WebSocket(`ws://${location.host}`);
        micRafId = setInterval(() => {
          analyser.getByteFrequencyData(buf);
          // Peak of bass bins (first 10 bins) — reacts faster than averaging
          let peak = 0;
          for (let i = 0; i < 10; i++) { if (buf[i] > peak) peak = buf[i]; }
          const volume = peak / 255;
          if (micSocket && micSocket.readyState === WebSocket.OPEN) {
            micSocket.send(JSON.stringify({ volume }));
          }
        }, 30);
      } catch (err) {
        showToast('Microphone access denied', true);
        btn.classList.remove('active');
        activeEffect = null;
        if (micSocket) { micSocket.close(); micSocket = null; }
        return;
      }
    }
    const body = { effect: effectId, target: 'govee' };
    if (effectId === 'fade' || effectId === 'dance') {
      const { r, g, b } = hexToRgb(fxColor);
      Object.assign(body, { r, g, b });
    }
    if (effectId === 'fade') {
      Object.assign(body, { timer: activeTimer });
    }
    await api('/api/effect', body);
    showToast(`Effect: ${btn.textContent}`);

    // Dance runs until the button is clicked again — no timer
    if (effectId === 'dance') return;

    // Start countdown on the active timer button
    const timerBtn = document.querySelector('.timer-btn.active');
    let remaining = activeTimer;
    clearInterval(countdownInterval);
    clearTimeout(timerInterval);
    countdownInterval = setInterval(() => {
      remaining--;
      if (timerBtn && remaining > 0) {
        timerBtn.innerHTML = `${remaining} <span class="unit">SEC</span>`;
      }
    }, 1000);
    timerInterval = setTimeout(async () => {
      clearInterval(countdownInterval);
      countdownInterval = null;
      document.querySelectorAll('.timer-btn').forEach(b => {
        b.innerHTML = `${b.dataset.secs} <span class="unit">SEC</span>`;
        b.classList.remove('active');
      });
      document.querySelectorAll('.fx-btn').forEach(b => b.classList.remove('active'));
      activeEffect = null;
      if (micRafId) { clearInterval(micRafId); micRafId = null; }
      if (micAudioCtx) { micAudioCtx.close(); micAudioCtx = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (micSocket) { micSocket.close(); micSocket = null; }
      await api('/api/power', { state: 'on', target: 'govee' }); // stopEffect server-side, leave lights on
      showToast('Effect stopped');
    }, activeTimer * 1000);
  }

  // ── Update ───────────────────────────────────────────────────────────────────

  async function pullUpdate() {
    const password = window.prompt('Enter update password:');
    if (password === null) return; // cancelled
    const btn = document.getElementById('updateBtn');
    btn.disabled = true;
    btn.textContent = '↓ Pulling…';
    try {
      const res = await fetch('/api/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      showToast(data.message || 'Updated!');
    } catch (e) {
      showToast(e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '↓ Update';
    }
  }

  // ── Toast ────────────────────────────────────────────────────────────────────

  let toastTimer;
  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = '', 2500);
  }

  // ── Status polling ────────────────────────────────────────────────────────────

  async function checkStatus() {
    try {
      const { ready } = await fetch('/api/status').then(r => r.json());
      if (ready) {
        document.getElementById('controls').classList.remove('disabled');
      }
    } catch { /* server offline — controls stay disabled */ }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────

  buildSwatches();

  document.getElementById('controls').classList.add('disabled');

  checkStatus();
  setInterval(checkStatus, 3000);
</script>
